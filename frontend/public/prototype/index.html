<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Co-Thinker · 交互原型</title>
  <link rel="stylesheet" href="./prototype.css">
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-mark" viewBox="0 0 32 32"><circle cx="12" cy="16" r="9"/><circle cx="20" cy="16" r="9"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-5 5 5-5 5 5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m10 6-6 6 6 6m-6-6h15"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 0 7M4 4v5h5m3-2v5l3 2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 3h13a1 1 0 0 1 1 1v17H6a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2Zm0 14h14M7 3v14m4-9h4m-4 4h4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-compare" viewBox="0 0 24 24"><path d="M3 5h7v14H3zm11 0h7v14h-7z"/></symbol>
    <symbol id="i-reply" viewBox="0 0 24 24"><path d="m9 5-6 6 6 6m-6-6h10a6 6 0 0 1 6 6v2"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v13h5"/></symbol>
  </defs></svg>

  <header class="masthead">
    <a class="brand" href="./" aria-label="Co-Thinker 原型首页"><svg><use href="#i-mark"/></svg><span>Co-Thinker</span></a>
    <div class="topic"><span class="topic-dot"></span>总结的时机</div>
    <nav aria-label="工作区">
      <button class="icon-button" id="restart" aria-label="重新演示" title="重新演示"><svg><use href="#i-history"/></svg></button>
      <button class="records-button" id="open-records" aria-label="讨论记录"><svg aria-hidden="true"><use href="#i-book"/></svg><span>讨论记录</span><span id="record-dot" class="record-dot" hidden></span></button>
    </nav>
  </header>

  <main class="workspace">
    <section class="conversation" aria-label="对话">
      <div class="thread" id="thread" role="log" aria-live="polite" aria-relevant="additions"></div>
      <button class="return-latest" id="return-latest" hidden>最新消息 <span>↓</span></button>
    </section>

    <section class="shared" id="shared" aria-label="讨论要点">
      <div class="shared-heading">
        <button class="shared-toggle" id="toggle-shared" aria-expanded="true"><span class="material-symbol"></span><span>讨论要点</span><svg><use href="#i-chevron"/></svg></button>
        <span class="shared-status" id="shared-status">待讨论</span>
      </div>
      <div id="shared-body">
        <div class="thought-line" id="thought-line"><span id="thought-text"></span></div>
        <div class="material-footer">
          <div class="material-actions">
            <button class="text-button" id="compare"><svg><use href="#i-compare"/></svg><span>展开对照</span></button>
            <button class="text-button" id="view-origin">修改记录<svg><use href="#i-chevron"/></svg></button>
          </div>
        </div>
        <div class="comparison" id="comparison" hidden></div>
      </div>
    </section>

    <section class="compose-area" aria-label="输入消息">
      <form class="composer" id="composer">
        <label class="sr-only" for="input">消息</label>
        <textarea id="input" rows="1" placeholder="输入消息" maxlength="3000"></textarea>
        <div class="composer-bottom"><span id="composer-context" role="status"></span><button id="send" class="send" type="submit" aria-label="发送" disabled><svg><use href="#i-arrow"/></svg></button></div>
      </form>
      <div class="footer-meta"><button id="about">交互原型 · 预设对话</button><button id="suggestion" class="demo-next">下一轮<svg aria-hidden="true"><use href="#i-chevron"/></svg></button></div>
      <div id="notice" class="notice" role="status" hidden></div>
    </section>
  </main>

  <dialog id="record-dialog" class="record-dialog" aria-labelledby="record-title">
    <header class="dialog-header"><div><p>总结的时机</p><h2 id="record-title">讨论记录</h2></div><button class="icon-button" data-close aria-label="关闭讨论记录"><svg><use href="#i-close"/></svg></button></header>
    <div class="record-body" id="record-body"></div>
    <footer class="dialog-footer"><button class="text-button" id="export-record"><svg><use href="#i-copy"/></svg><span>复制记录</span></button></footer>
  </dialog>

  <dialog id="origin-dialog" class="origin-dialog" aria-labelledby="origin-title">
    <header class="dialog-header"><h2 id="origin-title">修改记录</h2><button class="icon-button" data-close aria-label="关闭修改记录"><svg><use href="#i-close"/></svg></button></header>
    <div id="origin-body" class="origin-body"></div>
    <footer class="dialog-footer"><button class="text-button" data-close>关闭</button></footer>
  </dialog>

  <dialog id="about-dialog" class="about-dialog" aria-labelledby="about-title">
    <header class="dialog-header"><h2 id="about-title">原型说明</h2><button class="icon-button" data-close aria-label="关闭原型说明"><svg><use href="#i-close"/></svg></button></header>
    <div class="about-body"><p>点击“下一轮”播放预设对话，也可输入与示例相关的补充。此原型未接入模型，不能自由对话。</p><p>Enter 发送，Shift Enter 换行。刷新或重新演示会清空当前内容。</p></div>
  </dialog>

  <script type="module" src="./prototype.js"></script>
</body>
</html>
